name: onedrive_reenable.ps1
description: Reverses OneDrive blocking policies and reinstalls OneDrive from Microsoft CDN
language: PowerShell
tags:
- Applications
- Windows
runAs: SYSTEM_USER
timeout: 15
readme: |
  Purpose
  -------
  Reverses the registry policies set by onedrive_remove_complete.ps1 and reinstalls OneDrive. Use this when a machine needs to switch back to Microsoft services.

  Usage Notes
  -----------
  - Validates administrative privileges
  - Removes HKLM GPO DisableFileSyncNGSC policy
  - Removes Explorer DisableOneDriveFileSync policy
  - Optionally cleans Default User profile policies
  - Downloads and installs OneDrive from Microsoft CDN
  - $installOneDrive: download and install OneDrive (default: true)
  - $cleanDefaultProfile: also clean Default User profile (default: true)
  - OneDrive download URL: https://go.microsoft.com/fwlink/?linkid=844652

  Requirements
  ------------
  - PowerShell 5.1 or later
  - Administrator privileges
  - Network connectivity to Microsoft CDN (for installation)
