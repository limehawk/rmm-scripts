name: windows_update_access_restore.ps1
description: Restores user access to Windows Update settings
language: PowerShell
tags:
- Patch
- Recovery
- Windows
runAs: SYSTEM_USER
timeout: 15
readme: |
  Purpose
  -------
  Removes the SetDisableUXWUAccess registry key to restore user access to Windows Update settings in the Settings app.

  Usage Notes
  -----------
  - Checks for SetDisableUXWUAccess registry key under HKLM:\SOFTWARE\Policies\Microsoft\Windows\WindowsUpdate
  - Removes the key if present; reports success if key did not exist
  - Counterpart to windows_update_access_toggle script

  Requirements
  ------------
  - Windows 10/11
  - Administrator privileges
