name: macos_auto_updates_enable.sh
description: Enables all automatic update settings on macOS
shell: BASH
runAs: SYSTEM
timeout: 15
readme: |
  Purpose
  -------
  Enables all automatic update settings on macOS including automatic checking, downloading, and installation of macOS updates, App Store updates, and security/critical updates. Ensures systems stay patched and secure.

  Usage Notes
  -----------
  - Verifies root/sudo privileges before making changes
  - Enables AutomaticCheckEnabled, AutomaticDownload, AutoUpdate
  - Enables ConfigDataInstall, CriticalUpdateInstall, AutomaticallyInstallMacOSUpdates
  - Verifies all settings were applied after enabling

  Requirements
  ------------
  - macOS 10.14 or later
  - Root/sudo privileges
