name: prinstall_list.ps1
description: Lists installed printers on the system using prinstall
shell: POWERSHELL
runAs: SYSTEM
timeout: 5
readme: |
  Purpose
  -------
  Lists all locally installed printers (USB, network, virtual) using prinstall's list command. Useful for auditing printer installations via RMM or verifying a printer was added successfully.
  
  Usage Notes
  -----------
  - Enumerates all printers Windows knows about via Get-Printer
  - No runtime variables required
  - Requires prinstall.exe installed (run prinstall_setup.ps1 first)
  
  Requirements
  ------------
  - Windows OS
  - prinstall.exe installed
