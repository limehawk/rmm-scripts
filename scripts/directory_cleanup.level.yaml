name: directory_cleanup.ps1
description: Deletes files and directories older than specified days
shell: POWERSHELL
runAs: SYSTEM
timeout: 15
readme: |
  Purpose
  -------
  Cleans up files and directories older than a specified number of days. Logs deleted items to a file in the target folder.
  
  Usage Notes
  -----------
  - Recursively scans subdirectories for files older than the specified threshold
  - Deletes matching files and removes empty directories afterward
  - Creates deleted_files.log in the target folder with details of each deletion
  
  Requirements
  ------------
  - Windows OS
  - Runtime variable: $runtime_folderPath (path to the folder to clean up)
  - Runtime variable: $runtime_days (number of days old a file must be to be deleted)
