name: local_user_delete.ps1
description: Deletes local user account and associated profile directory
language: PowerShell
tags:
- Administration
- Cleanup
- Windows
runAs: SYSTEM_USER
timeout: 15
readme: |
  Purpose
  -------
  Deletes a local user account and its associated profile directory. Completely removes the user from the system including their files.

  Usage Notes
  -----------
  - Set to "listusers" mode to list all local users without deleting
  - Validates that the target user exists before proceeding
  - Removes user profile via CIM, falls back to direct filesystem removal
  - Removes the local user account after profile cleanup
  - Reports final status

  Requirements
  ------------
  - Windows 10/11
  - Admin privileges required
  - PowerShell 5.1+
  - Username provided via SuperOps $UsernameToDelete variable

  Security
  --------
  - Destructive operation -- data cannot be recovered
  - Backup important data before running
favourite: false
shared: true
runtimeVariables:
- name: UsernameToDelete
scriptId: '1015904364706459648'
lastPushedChecksum: sha256:16d8ccc7f3be11d4
lastPushedMetaChecksum: sha256:3cef8c4e472efc71
