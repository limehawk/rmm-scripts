name: splashtop_service_restart_macos.sh
description: Restarts Splashtop Streamer service on macOS
shell: BASH
runAs: SYSTEM
timeout: 15
readme: |
  Purpose
  -------
  Restarts the Splashtop Streamer service on macOS when remote access becomes unresponsive or connections fail. Useful for resolving connectivity issues without requiring a full system reboot.

  Usage Notes
  -----------
  - Validates that the plist path is configured and exists
  - Uses launchctl to manage the service lifecycle
  - Unloads the Splashtop launch daemon (stops it), then reloads it (starts it)
  - Plist path: /Library/LaunchDaemons/com.splashtop.streamer-for-admin.plist

  Requirements
  ------------
  - macOS operating system
  - Root/sudo privileges
  - Splashtop Streamer installed
