name: splashtop_business_install.ps1
description: Downloads and installs Splashtop Business client silently
language: PowerShell
tags:
- Software
- Windows
runAs: SYSTEM_USER
timeout: 15
readme: |
  Purpose
  -------
  Downloads and silently installs the Splashtop Business client application. This is the end-user remote access client, not the streamer agent.

  Usage Notes
  -----------
  - Downloads MSI installer from official Splashtop redirect URL
  - Creates temporary directory if needed
  - Installs silently via msiexec with verbose logging
  - Cleans up installer file after installation
  - Uses curl.exe if available, falls back to Invoke-WebRequest

  Requirements
  ------------
  - Windows OS
  - Administrator privileges
  - Internet connectivity
  - $downloadUrl: URL to Splashtop Business MSI installer
  - $tempDirectory: directory for temporary installer storage
