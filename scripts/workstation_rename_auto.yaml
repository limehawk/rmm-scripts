name: workstation_rename_auto.ps1
description: Auto-renames Windows device using CLIENT3-USER-UUID pattern
language: PowerShell
tags:
- Administration
- Windows
runAs: SYSTEM_USER
timeout: 15
readme: |
  Purpose
  -------
  Renames a Windows device using the pattern CLIENT3-USERUUID (max 15 chars) and syncs the same name to SuperOps. CLIENT3 is a 3-char abbreviation of the client name, USER is the sanitized username (maximized, truncated if needed), and UUID is the SMBIOS UUID tail (at least 3 chars).

  Usage Notes
  -----------
  - Requires SuperOps runtime variables:
    - $YourApiKeyHere: SuperOps API key
    - $YourAssetIdHere: Asset ID (placeholder)
    - $YourAssetNameHere: Current asset name (placeholder)
    - $YourClientNameHere: Client name (placeholder)
  - Only A-Z, 0-9, and hyphen used in hostname
  - Always exactly 15 characters
  - SuperOps asset name updated via GraphQL API
  - Reboot required for hostname change to take effect

  Requirements
  ------------
  - Windows 10/11
  - Administrator privileges
  - SuperOps agent installed
  - Internet access for SuperOps API
favourite: false
shared: true
runtimeVariables:
- name: YourApiKeyHere
placeholderVariables:
- name: YourAssetIdHere
  label: Asset ID
  column: assetId
- name: YourAssetNameHere
  label: Asset name
  column: name
- name: YourClientNameHere
  label: Client name
  column: client.name
scriptId: '8083616885623574528'
lastPushedChecksum: sha256:d5996dd1d435f7a6
