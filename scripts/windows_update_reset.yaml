name: windows_update_reset.ps1
description: Resets Windows Update components and clears cache
language: PowerShell
tags:
- Antivirus
- Patch
- Services
- Windows
runAs: SYSTEM_USER
timeout: 15
readme: |
  Purpose
  -------
  Completely resets Windows Update components by stopping services, clearing caches, resetting security descriptors, re-registering DLLs, and restarting services. Fixes most Windows Update problems.

  Usage Notes
  -----------
  - Stops BITS, wuauserv, appidsvc, cryptsvc services
  - Flushes DNS cache and clears BITS download queue data
  - Renames SoftwareDistribution and catroot2 folders (creates .bak for recovery)
  - Resets BITS and wuauserv security descriptors
  - Re-registers 30+ Windows Update related DLLs
  - Resets Winsock
  - Restarts all services after reset
  - Optional RebootAfterReset (default: false)

  Requirements
  ------------
  - Windows 10/11
  - Administrator privileges
  - Internet connectivity for updates after reset

  Security
  --------
  - Modifies system registry and service configurations
  - Creates .bak folders for recovery of renamed directories
