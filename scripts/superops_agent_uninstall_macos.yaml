name: superops_agent_uninstall_macos.sh
description: Uninstalls SuperOps/Limehawk RMM agent from macOS
language: Bash
tags:
- Cleanup
- Mac
- Software
runAs: SYSTEM_USER
timeout: 15
readme: |
  Purpose
  -------
  Uninstalls the SuperOps RMM agent from macOS by running the vendor uninstall.sh from every known SuperOps and Limehawk install path. Already-removed is success.

  Usage Notes
  -----------
  - Tries each path in order and runs the first uninstall.sh found
  - Missing agent is exit 0
  - Looks under /Library/superops, limehawk, limehawkrmm, Limehawkrmmagent

  Requirements
  ------------
  - Bash, macOS, sudo
  - UNINSTALL_PATHS: hardcoded list of vendor uninstall.sh locations

  Security
  --------
  - Runs only the vendor uninstall script
