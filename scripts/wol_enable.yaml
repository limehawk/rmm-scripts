name: wol_enable.ps1
description: Enables Wake-on-LAN in BIOS and Windows NIC settings for Dell, HP, and Lenovo systems
language: PowerShell
tags:
- Network
- Windows
runAs: SYSTEM_USER
timeout: 15
readme: |
  Purpose
  -------
  Enables Wake-on-LAN (WOL) in both BIOS/UEFI and Windows NIC settings. Supports Dell, HP, and Lenovo systems with manufacturer-specific BIOS modules. Also enables WOL on all capable network adapters in Windows.

  Usage Notes
  -----------
  - Auto-detects system manufacturer via CIM
  - Checks and installs required PowerShell modules (NuGet, PSGallery)
  - Installs manufacturer-specific BIOS module if needed
  - Dell: Uses DellBIOSProvider, sets WakeOnLan to LANOnly
  - HP: Uses HPCMSL, sets Wake On Lan to Boot to Hard Drive
  - Lenovo: Uses WMI, sets WakeOnLAN to Primary
  - Enables MSPower_DeviceWakeEnable on all capable Windows NICs

  Requirements
  ------------
  - Windows 10/11
  - Administrator privileges
  - Internet connectivity for module installation
  - Supported manufacturer: Dell, HP, or Lenovo

  Security
  --------
  - Modifies BIOS settings (requires admin)
  - Installs PowerShell modules from PSGallery
