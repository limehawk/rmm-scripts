name: password_files_search.ps1
description: Searches user profiles for password and credential files
shell: POWERSHELL
runAs: SYSTEM
timeout: 15
readme: |
  Purpose
  -------
  Scans all user profiles on a Windows machine for files that may contain passwords or credentials. Useful for security audits to identify exposed sensitive data in common user directories.

  Usage Notes
  -----------
  - Enumerates all user profiles in C:\Users (excludes Public, Default)
  - Searches Desktop, Documents, Downloads, Pictures, and cloud folders (OneDrive, Dropbox, Google Drive, Box)
  - Patterns include: *password*, *credential*, *creds*, *logins*, etc.
  - Critical patterns flagged separately: 1Password Emergency Kit, KeePass, BitWarden backup, seed phrase, private keys
  - Uses Windows Search Index if available, falls back to filesystem search
  - Max search depth: 10 levels
  - Optional Google Chat webhook alert via $GoogleChatWebhook variable (sent only when files found)
  - Read-only operation -- does not modify or delete files
  - File contents are NOT read, only metadata reported (path, size, modified date)

  Requirements
  ------------
  - PowerShell 5.1 or later
  - Administrator privileges (to access other user profiles)
  - SuperOps runtime variable: GoogleChatWebhook (optional)
variables:
- name: GoogleChatWebhook
