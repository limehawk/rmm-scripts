name: speedtest_export_superops.ps1
description: Runs Ookla Speedtest and syncs results to SuperOps custom fields
shell: POWERSHELL
runAs: SYSTEM
timeout: 15
readme: |
  Purpose
  -------
  Downloads and runs Ookla Speedtest CLI, captures network performance metrics, and synchronizes the results to SuperOps custom fields for monitoring and reporting. Designed for RMM automation to track internet connectivity quality.

  Usage Notes
  -----------
  - Automatically downloads and extracts Speedtest CLI ZIP if not already present
  - Executes speedtest with JSON output (auto-accepts license and GDPR terms)
  - Calculates speeds in Mbps with full decimal precision
  - Sends four custom fields to SuperOps: Download Speed, Upload Speed, ISP, Speedtest URL
  - Reports detailed metrics to console including ping, jitter, packet loss, and server info
  - Downloads from https://install.speedtest.net/app/cli/
  - Extraction path: $env:TEMP\SpeedtestCLI

  Requirements
  ------------
  - SuperOps PowerShell module must be available and authenticated
  - Internet connectivity for downloading CLI and running speedtest
  - Write permissions to $env:TEMP directory
  - Windows with PowerShell 5.1+ or PowerShell 7+
  - SuperOps custom fields must exist: Download Speed (Decimal), Upload Speed (Decimal), ISP (Short Text), Speedtest URL (Short Text)
