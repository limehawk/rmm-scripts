name: usmt_lan_migrate.ps1
description: LAN profile migration over USMT, store moved via LocalSend or path
shell: POWERSHELL
runAs: SYSTEM
timeout: 60
readme: |
  Purpose
  -------
  Migrates a Windows local-account user profile from an OLD laptop to a NEW laptop across the same local network using USMT. The same script is dropped on both machines; a role selector decides whether the machine is the Sender (old) or the Receiver (new). The compressed USMT migration store (USMT.MIG) is moved between machines by LocalSend (primary) or a plain file path (UNC/SMB/USB) fallback. Carries profile data and settings only, not installed applications. Targets are local accounts in a workgroup; Entra/Azure AD accounts are out of scope.
  
  Usage Notes
  -----------
  - Interactive by default (menu asks role first: OLD/Sender vs NEW/Receiver), or unattended via the hardcoded CONFIG block at the top of the script.
  - Sender: installs USMT + LocalSend CLI, picks the profile, runs a scanstate /p space estimate, then scanstate with compression ON to produce a single USMT.MIG, then sends the store.
  - Receiver: installs USMT + LocalSend CLI, opens a temporary firewall rule and receives the store (or reads it from a path), optionally creates the target local account, then runs loadstate with /mu source:target mapping. Unattended runs still require -Force/config flag before the destructive loadstate.
  - Compression is forced ON so the store is one clean USMT.MIG for a single LocalSend transfer.
  - For very large profiles (>20 GB) over WiFi, the path transport (wired/USB/UNC) is recommended; the Sender warns when the estimate is large.
  - LocalSend CLI used: 0w0mewo/localsend-cli (Go), release v0.0.7, port 53317. send --ip <IP> -f <file>; recv -d <dir>; scan -t <sec>. Verified against the CLI command source, not the stub official README.
  - Default staging/store path: C:\MigrationStore
  
  Requirements
  ------------
  - Windows 10/11 or Windows Server, PowerShell 5.1+
  - Administrator privileges (loadstate, account creation, firewall rule, scanstate)
  - Both machines on the same subnet (LocalSend discovery uses mDNS)
  - Internet connectivity on first run (USMT + LocalSend CLI download)
  - Sufficient disk for the migration store on both ends
  
  Security
  --------
  - No secrets in logs: the encryption key and new-account password are never printed and never written to backup_info.json (the key is recorded only as the literal "[ENCRYPTED]" marker).
  - The temporary inbound firewall rule for the LocalSend port is always removed in a finally block, even on failure.
  - LocalSend transfer is HTTPS by default.
