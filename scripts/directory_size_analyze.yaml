name: directory_size_analyze.ps1
description: Analyzes disk usage with gdu utility for directory size reports
language: PowerShell
tags:
- Disk
- Windows
runAs: SYSTEM_USER
timeout: 15
readme: |
  Purpose
  -------
  Runs a command-line disk usage analysis on a specified directory using gdu (Go Disk Usage analyzer). Downloads gdu from GitHub releases if not already present, extracts it to a local cache directory, and executes it against the target path in non-interactive mode.

  Usage Notes
  -----------
  - Set $YourTargetDirectoryHere runtime variable to the path to scan (e.g., C:\Users)
  - Designed for unattended RMM execution
  - Downloads and caches gdu utility automatically; no package manager dependencies
  - Supports text or JSON output formats (OutputFormat setting)
  - Includes timeout protection for long-running scans (ScanTimeout setting)
  - Optional cleanup of downloaded files after completion (CleanupAfterRun setting)
  - Configurable scan depth controls top N items shown

  Requirements
  ------------
  - PowerShell 5.1 or later
  - Internet access to reach github.com for initial download
  - Write permissions to the cache directory
  - Runtime variable: $YourTargetDirectoryHere (target directory to scan)
favourite: false
shared: false
runtimeVariables:
- name: YourTargetDirectoryHere
scriptId: '259059079201808384'
