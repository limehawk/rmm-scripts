name: superops_agent_reinstall_macos.sh
description: Uninstalls and reinstalls SuperOps RMM agent on macOS
shell: BASH
runAs: SYSTEM
timeout: 15
readme: |
  Purpose
  -------
  Performs a complete reinstallation of the SuperOps RMM agent on macOS by uninstalling the current agent and installing a new version from a provided URL. Useful for agent upgrades or fixing corrupted installations.
  
  Usage Notes
  -----------
  - PKGURL environment variable must be set by RMM platform
  - Uses background process to handle reinstall after uninstall
  - Downloads new agent to /tmp directory
  - 5-second polling interval for uninstall completion
  - Uses official SuperOps uninstall script at /Library/superops/uninstall.sh
  - Monitors agent processes to ensure clean uninstall before installing
  
  Requirements
  ------------
  - macOS
  - Sudo privileges
  - Internet access
  - SuperOps RMM agent currently installed
  - PKGURL environment variable set by RMM platform
  - curl command (standard on macOS)
