name: prinstall_install_printer.ps1
description: Installs a network or USB printer using prinstall
language: PowerShell
tags:
- Printers
- Windows
runAs: SYSTEM_USER
timeout: 10
readme: |
  Purpose
  -------
  Installs a printer on Windows using prinstall. Network mode creates the TCP/IP port, installs the driver, and adds the queue. USB mode stages the driver only — Windows handles the rest on plug-in.

  Usage Notes
  -----------
  - Set $usbMode to $true for USB printers (driver-only, no port/queue)
  - Printer IP required for network mode via $YourPrinterIpHere
  - Driver name optional via $YourDriverNameHere (auto-detects if not set)
  - Display name optional via $YourPrinterNameHere (uses model name if not set)
  - Requires prinstall.exe installed (run prinstall_setup.ps1 first)

  Requirements
  ------------
  - Windows OS
  - Administrator privileges
  - prinstall.exe installed
  - Network access to printer IP (network mode only)
  - $YourPrinterIpHere: Printer IP address (network mode)
  - $YourDriverNameHere: (optional) Specific driver name
  - $YourPrinterNameHere: (optional) Display name for the printer
favourite: false
shared: false
runtimeVariables:
- name: YourPrinterIpHere
- name: YourDriverNameHere
- name: YourPrinterNameHere
scriptId: '263150824947322880'
