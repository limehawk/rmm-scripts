name: edge_set_chrome_default_user.ps1
description: Sets Google Chrome as default browser for current user via SetUserFTA
language: PowerShell
tags:
- Applications
- Windows
runAs: SYSTEM_USER
timeout: 15
readme: |
  Purpose
  -------
  Sets Google Chrome as the default browser for the current user. Uses SetUserFTA to properly set file associations with the correct UserChoice hash that Windows 10/11 requires. Must run as the logged-in user (not SYSTEM) because default browser settings are per-user and stored in HKCU with hash validation.

  Usage Notes
  -----------
  - Verifies Chrome is installed
  - Checks that script is NOT running as SYSTEM
  - Downloads SetUserFTA if not present
  - Sets Chrome as default for http, https, .htm, .html
  - All options default to $true; set individual booleans to $false to skip specific associations
  - $cleanUserStartup: remove Edge from user's startup programs
  - SetUserFTA is hosted in the limehawk rmm-scripts repo; change URL if hosted elsewhere

  Requirements
  ------------
  - PowerShell 5.1 or later
  - Must run as logged-in user (NOT as SYSTEM)
  - Google Chrome must be installed
  - Internet access (to download SetUserFTA if needed)
