name: mrt_scan.ps1
description: Runs Microsoft Malicious Software Removal Tool with configurable scan mode
language: PowerShell
tags:
- Antivirus
- Windows
runAs: SYSTEM_USER
timeout: 60
readme: |
  Purpose
  -------
  Executes the built-in Windows Malicious Software Removal Tool (MRT.exe) with configurable scan mode. Designed for RMM deployment via SuperOps, allowing administrators to trigger Quick or Full silent scans on target endpoints. Displays scan status and log preview upon completion.

  Usage Notes
  -----------
  - Validates administrative privileges before scanning
  - Validates scan mode is Quick or Full
  - Executes MRT with /Q for Quick or /F /Q for Full
  - Waits for scan completion (minutes to hours depending on mode)
  - Displays last 50 lines of MRT log file for review
  - RMM variable injection configures $ScanMode at runtime

  Requirements
  ------------
  - Windows OS with MRT.exe (included by default)
  - Administrator privileges
  - PowerShell 5.1+
  - SuperOps module available via $SuperOpsModule variable
  - $ScanMode set to Quick or Full (case-insensitive)
favourite: false
shared: true
runtimeVariables:
- name: QuickOrFull
scriptId: '5428837218762698752'
