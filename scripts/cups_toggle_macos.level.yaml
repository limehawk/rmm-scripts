name: cups_toggle_macos.sh
description: Toggles CUPS web interface on/off for printer administration
shell: BASH
runAs: SYSTEM
timeout: 900
readme: |
  Purpose
  -------
  Toggles the CUPS (Common Unix Printing System) web interface on or off. If currently enabled, disables it. If disabled, enables it. Useful for managing printer administration access on macOS and Linux systems.
  
  Usage Notes
  -----------
  - Verifies root/sudo privileges before proceeding
  - Auto-detects current CUPS web interface status via cupsctl
  - Toggles to opposite state and reports the new status
  - Web interface URL when enabled: http://localhost:631
  
  Requirements
  ------------
  - macOS or Linux with CUPS installed
  - cupsctl command available
  - Root/sudo privileges
  
  Security
  --------
  - Enabling the web interface exposes printer admin on localhost:631
