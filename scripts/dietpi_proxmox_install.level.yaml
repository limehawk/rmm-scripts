name: dietpi_proxmox_install.sh
description: Creates lightweight DietPi Debian 12 VM on Proxmox
shell: BASH
runAs: SYSTEM
timeout: 900
readme: |
  Purpose
  -------
  Downloads and runs the DietPi Debian 12 Bookworm VM installer for Proxmox. Creates a lightweight Debian-based VM optimized for low resource usage.
  
  Usage Notes
  -----------
  - Downloads the installer script from limehawk/proxmox-scripts repository on GitHub
  - Executes the installer via bash and returns its exit code
  - No hardcoded inputs required; installer is fetched from remote source
  
  Requirements
  ------------
  - Proxmox VE host
  - Run from Proxmox shell (not inside a VM)
  - Internet access to GitHub
  - curl installed
  
  Security
  --------
  - Executes remote code fetched over HTTPS - review source before running
