name: secure_delete_interactive.ps1
description: Interactive version of secure delete - prompts user for all inputs
language: PowerShell
tags:
- Cleanup
- Interactive
- Security
- Windows
runAs: LOGGED_IN_USER
timeout: 30
readme: |
  Purpose
  -------
  Interactive wizard for secure file deletion using Microsoft SDelete with DoD 5220.22-M compliant overwriting. Guides users through configuration options step-by-step before performing deletion. Creates comprehensive documentation suitable for legal proceedings.

  Usage Notes
  -----------
  - Step-by-step prompts for target path, operator name, case reference, and settings
  - Dry run mode available to preview before actual deletion
  - Generates SHA-256 and MD5 hashes of all files before deletion
  - Produces comprehensive certificate of destruction (text and HTML)
  - Captures system information for audit trail
  - Auto-installs SDelete via winget if not present
  - Shows summary of all selections for confirmation before proceeding
  - Supports recursive deletion of directories
  - Configurable number of overwrite passes (default: 3)

  Requirements
  ------------
  - Interactive terminal (not suitable for RMM/headless execution)
  - Microsoft SDelete (auto-installed via winget if enabled)
  - PowerShell 5.1 or later
  - Administrator rights recommended for complete metadata access

  Security
  --------
  - Certificate contains file paths and hashes which may be sensitive
  - Store certificates securely according to legal requirements
