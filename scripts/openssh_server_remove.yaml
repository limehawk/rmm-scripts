name: openssh_server_remove.ps1
description: Removes OpenSSH Server, firewall rule, and cleans up config and
  host keys
language: PowerShell
runAs: SYSTEM_USER
timeout: 5
tags:
  - Windows
  - Remote Access
shared: false
favourite: false
readme: >
  ## Purpose

  Stops and removes the OpenSSH Server from Windows. Removes the firewall
  rule, uninstalls the Windows capability, and cleans up the sshd config
  directory including host keys.


  ## Usage Notes

  - Removes firewall rule OpenSSH-Server-In-TCP

  - Deletes C:\ProgramData\ssh (config, host keys, authorized_keys)

  - Removes default shell registry key

  - Safe to run if OpenSSH is already uninstalled (exits 0)


  ## Requirements

  - Windows Server 2019+ or Windows 10 1809+

  - Administrator privileges
