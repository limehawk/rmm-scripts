name: network_service_refresh_macos.sh
description: Refreshes all macOS network services by toggling them off and on
shell: BASH
runAs: SYSTEM
timeout: 15
readme: |
  Purpose
  -------
  Refreshes all network services on macOS by toggling them off and on. Preserves the original enabled/disabled state of each service. Useful for resolving DHCP lease issues, DNS problems, or general network connectivity problems without requiring a full system restart.
  
  Usage Notes
  -----------
  - Lists all network services and processes each one
  - Records initial enabled/disabled state before toggling
  - Disables each service, waits briefly, then re-enables
  - Restores original state if a service was previously disabled
  - TOGGLE_DELAY controls wait time between off/on (default: 2 seconds)
  - Temporarily disrupts network connectivity during refresh
  
  Requirements
  ------------
  - Root/sudo access required
  - macOS 10.14 or later
  - networksetup command available
