name: choco_upgrade_all.ps1
description: Upgrades all Chocolatey-managed packages to latest versions
shell: POWERSHELL
runAs: SYSTEM
timeout: 900
readme: |
  Purpose
  -------
  Upgrades all Chocolatey-managed packages to their latest versions using the choco upgrade all command with automatic confirmation.
  
  Usage Notes
  -----------
  - Checks if Chocolatey is installed before proceeding
  - Runs choco upgrade all with auto-confirmation flag (-y) for unattended operation
  - Operates on all installed Chocolatey packages; no configuration required
  
  Requirements
  ------------
  - Windows OS
  - Administrator privileges
  - Chocolatey package manager installed
