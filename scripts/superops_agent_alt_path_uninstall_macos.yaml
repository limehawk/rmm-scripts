name: superops_agent_alt_path_uninstall_macos.sh
description: Uninstalls SuperOps agent from alternate /Library/limehawk path
language: Bash
tags:
- Cleanup
- Mac
- Software
runAs: SYSTEM_USER
timeout: 15
readme: |
  Purpose
  -------
  Uninstalls the SuperOps agent from macOS systems by executing the agent's built-in uninstall script from an alternate path (/Library/limehawk). Use this for agents installed to the alternate limehawk path instead of the default SuperOps path.

  Usage Notes
  -----------
  - Uses uninstall script at /Library/limehawk/uninstall.sh
  - Executes with sudo privileges
  - Reports completion status after uninstall

  Requirements
  ------------
  - macOS operating system
  - Sudo privileges
  - Uninstall script must exist at /Library/limehawk/uninstall.sh
