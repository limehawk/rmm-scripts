name: public_ip_export_superops.ps1
description: Fetches public IP info from wtfismyip.com and syncs to SuperOps
language: PowerShell
tags:
  - Network
  - Windows
runAs: SYSTEM_USER
timeout: 15
readme: |
  Purpose
  -------
  Queries wtfismyip.com/json to retrieve public IP address, ISP, geolocation, and hostname information. Formats the results into a readable multiline string and sends it to a SuperOps custom field for network visibility and auditing.
  
  Usage Notes
  -----------
  - Queries wtfismyip.com/json for public IP details
  - Parses JSON response and formats into readable multiline text
  - Formats IP, Location, Hostname, ISP, Country, and Tor Exit status
  - Sends formatted text to SuperOps "Public IP" custom field
  - Uses Invoke-RestMethod (no external binaries required)
  
  Requirements
  ------------
  - SuperOps PowerShell module must be available and authenticated
  - Internet connectivity to reach wtfismyip.com
  - Windows with PowerShell 5.1+ or PowerShell 7+
  - SuperOps custom field "Public IP" (Paragraph / plain-text) must exist in tenant
  - $apiUrl: wtfismyip.com JSON endpoint
  - $customFieldName: SuperOps custom field name
