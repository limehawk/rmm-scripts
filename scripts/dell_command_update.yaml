name: dell_command_update.ps1
description: Installs Dell Command Update via winget and applies driver/firmware updates silently
language: PowerShell
tags:
- Maintenance
- Windows
runAs: SYSTEM_USER
timeout: 15
readme: |
  ## Purpose
  Installs Dell Command Update via winget and runs it to scan and apply driver/firmware updates silently. Designed for automated Dell system maintenance in RMM environments.

  ## Usage Notes
  - Configures DCU for silent operation: auto-suspend BitLocker, disable user consent prompts
  - Applies updates without rebooting (reboot=disable)
  - Logs scan and apply operations to C:\dell\logs
  - Script will fail on non-Dell hardware

  ## Requirements
  - Windows 10 1809+ or Windows 11 with winget
  - Dell system hardware
  - Administrator privileges
