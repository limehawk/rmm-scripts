name: reboot_force_now
language: PowerShell
runAs: SYSTEM_USER
timeout: 15
readme: |
  Purpose
  -------
  Forces an immediate system reboot, closing all applications without saving or prompting. Designed for RMM deployment when a machine needs to be rebooted regardless of user activity or open applications.

  Usage Notes
  -----------
  - Initiates forced immediate reboot via shutdown.exe
  - Force mode enabled: closes applications without prompting
  - Timeout: 0 seconds (immediate reboot)
  - Users will lose unsaved work

  Requirements
  ------------
  - PowerShell 5.1 or later
  - Administrator privileges
