name: openssh_server_setup.ps1
description: Installs and configures OpenSSH Server on Windows
shell: POWERSHELL
runAs: SYSTEM
timeout: 300
readme: |
  Purpose
  -------
  Installs the OpenSSH Server Windows capability, configures the sshd service for automatic startup, enables public key authentication, and opens the Windows Firewall for SSH traffic on port 22.
  
  Usage Notes
  -----------
  - Checks if OpenSSH Server is already installed before proceeding
  - Configures sshd_config for key auth and restricted access
  - Default shell set to PowerShell for SSH sessions
  - Access restricted to Administrators group via AllowGroups in sshd_config
  - Configures sshd service for Automatic (Delayed Start)
  - Opens Windows Firewall for SSH traffic on configured port
  - Verifies SSH is listening on the configured port after start
  - $SshPort default: 22
  - $DefaultShell default: PowerShell
  - $AllowedUsersGroup default: Administrators
  - Password authentication: enabled
  - Public key authentication: enabled
  
  Requirements
  ------------
  - Windows Server 2019+ or Windows 10 1809+
  - Administrator privileges
  - Internet access if OpenSSH capability not already present
  
  Security
  --------
  - Access restricted to Administrators group by default
  - Public key authentication enabled for passwordless access
  - Password authentication left enabled for initial setup convenience
