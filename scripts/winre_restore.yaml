name: winre_restore.ps1
description: Restores Windows Recovery Environment from system image
language: PowerShell
tags:
- Disk
- Recovery
- Windows
runAs: SYSTEM_USER
timeout: 15
readme: |
  Purpose
  -------
  Restores Windows Recovery Environment (WinRE) by downloading Winre.wim and ReAgent.xml files from a specified URL and placing them in the Recovery folder. Fixes systems where WinRE has been corrupted or deleted.

  Usage Notes
  -----------
  - Configure WinreWimUrl and ReAgentXmlUrl in script before deployment
  - Disables WinRE via reagentc /disable before restore
  - Downloads files to TEMP then moves to C:\Windows\System32\Recovery
  - Re-enables WinRE via reagentc /enable after restore
  - Uses curl with retry and timeout for downloads

  Requirements
  ------------
  - Windows 10/11
  - Administrator privileges
  - Network connectivity to download URLs
  - Valid WinRE files hosted at specified URLs

  Security
  --------
  - Downloads from specified URLs; ensure URLs are trusted
  - Modifies system recovery configuration
