name: winreagent_cleanup.ps1
description: Cleans up WinREAgent folder to free disk space
language: PowerShell
tags:
- Cleanup
- Disk
- Windows
runAs: SYSTEM_USER
timeout: 15
readme: |
  Purpose
  -------
  Deletes the C:\$WinREAgent folder which contains temporary Windows Recovery Environment update files. This folder can consume significant disk space and is safe to delete after WinRE updates are complete.

  Usage Notes
  -----------
  - FolderPath defaults to C:\$WinREAgent
  - Checks if folder exists before attempting deletion
  - Deletes folder and all contents recursively
  - Handles hidden/system folder attributes
  - Exits successfully if folder does not exist

  Requirements
  ------------
  - Windows 10/11
  - Administrator privileges recommended
