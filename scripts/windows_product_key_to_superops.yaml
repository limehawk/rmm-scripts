name: windows_product_key_to_superops.ps1
description: Retrieves Windows product key and syncs to SuperOps custom field
language: PowerShell
tags:
- Software
- Windows
runAs: SYSTEM_USER
timeout: 15
readme: |
  Purpose
  -------
  Retrieves the Windows product key from the local machine's registry by decoding the DigitalProductId value and sends it to a SuperOps custom field for asset management and license tracking.

  Usage Notes
  -----------
  - Decodes DigitalProductId from HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion
  - Sends product key to SuperOps custom field via Send-CustomField
  - CustomFieldName defaults to "Windows Product Key"
  - Product key format: XXXXX-XXXXX-XXXXX-XXXXX-XXXXX

  Requirements
  ------------
  - PowerShell 5.1 or later
  - SuperOps RMM agent installed and module available ($SuperOpsModule)
  - Registry access to read Windows product information

  Security
  --------
  - Product key is considered sensitive licensing data
  - Product key is sent to SuperOps; no secrets appear in local logs
