name: file_search_everything.ps1
description: Searches all fixed drives for files matching a pattern
language: PowerShell
tags:
- Utilities
- Windows
runAs: SYSTEM_USER
timeout: 15
readme: |
  Purpose
  -------
  Searches all fixed local drives for files matching a wildcard pattern using native PowerShell. No third-party tools required.

  Usage Notes
  -----------
  - Enumerates all fixed drives (DriveType 3)
  - Recursively searches each drive with Get-ChildItem
  - Skips inaccessible directories silently
  - Outputs full paths of all matches

  Requirements
  ------------
  - PowerShell 5.1 or later
  - Administrator privileges recommended for full access
  - $searchPattern: wildcard pattern (e.g., *landtrust*, *.pdf)
