name: file_search_everything.ps1
description: Searches entire system for files matching a pattern using Everything
language: PowerShell
tags:
- Utilities
- Windows
runAs: SYSTEM_USER
timeout: 15
readme: |
  Purpose
  -------
  Deploys Voidtools Everything to a Windows endpoint, searches for files matching a hardcoded pattern, and outputs results to stdout. Everything indexes NTFS volumes in seconds, making full-drive searches near-instant. If Everything was not previously installed, the script cleans it up afterward.

  Usage Notes
  -----------
  - Detects execution context (SYSTEM vs user) and resolves winget accordingly
  - Installs Everything via winget if not already present
  - Starts Everything service and waits for index to build (60s timeout)
  - Runs search and outputs matching file paths to stdout
  - Cleans up: stops service, uninstalls if script installed it
  - Index timeout: 60 seconds max, polls every 2 seconds
  - Search scope: all NTFS volumes indexed by Everything

  Requirements
  ------------
  - Windows 10 1709+ or Windows 11 (winget required)
  - Administrator privileges
  - NTFS filesystem
  - $searchTerm: file name pattern to search for (Everything syntax)
