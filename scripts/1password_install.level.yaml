name: "1password_install.ps1"
description: Downloads and silently installs 1Password using official MSI
shell: POWERSHELL
runAs: SYSTEM
timeout: 15
readme: |
  Purpose
  -------
  Downloads and silently installs the latest version of 1Password for Windows using the official MSI installer with configurable deployment options.
  
  Usage Notes
  -----------
  - Validates input parameters before proceeding
  - Downloads 1Password MSI installer to temp directory
  - Builds MSI arguments based on deployment options and installs silently using msiexec
  - Cleans up installer file after completion
  - Download URL: https://downloads.1password.com/win/1PasswordSetup-latest.msi
  - Prevent Restart: true
  - Manage Updates: false
  - Remove Other Installs: true
  
  Requirements
  ------------
  - Windows PowerShell 5.1 or later
  - Administrator privileges
  - Internet connectivity
