readme: |
  ## Purpose
  Downloads and runs the DietPi Debian 12 Bookworm VM installer for Proxmox. Creates a lightweight Debian-based VM optimized for low resource usage.

  ## Usage Notes
  - Downloads installer from limehawk/proxmox-scripts repository
  - Script is fetched over HTTPS
  - Executes remote code - review source before running

  ## Requirements
  - Proxmox VE host
  - Run from Proxmox shell (not inside a VM)
  - Internet access to GitHub
  - curl installed
