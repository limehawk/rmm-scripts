name: rustic_uninstall.ps1
description: Removes rustic binary, config, scheduled task, and logs
language: PowerShell
tags:
- Backup
- Software
- Windows
runAs: SYSTEM_USER
timeout: 5
readme: |
  Purpose
  -------
  Removes all local Rustic components from the machine: the Windows Scheduled Task and the entire install directory (binary, config, backup script, and logs). Does NOT delete the remote backup repository. Safe to run even if components are already absent — partial removal is acceptable and always exits 0.

  Usage Notes
  -----------
  - Removes the 'Limehawk Rustic Backup' scheduled task if it exists
  - Removes C:\ProgramData\Limehawk\Rustic and all contents recursively
  - Reports found/not-found for each component before acting
  - Always exits 0 — cleanup is idempotent

  Requirements
  ------------
  - Windows 10/11 or Windows Server 2016+
  - Administrator privileges (runs as SYSTEM via RMM)
favourite: false
shared: false
