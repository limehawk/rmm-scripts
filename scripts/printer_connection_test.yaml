name: printer_connection_test.sh
description: Tests network printer connectivity via ping and IPP port check
language: Bash
tags:
- Linux
- macOS
- Printers
runAs: SYSTEM_USER
timeout: 15
readme: |
  Purpose
  -------
  Tests network connectivity to configured printers by pinging their hostnames/IPs. Reports success/failure for each printer and optionally sends an email alert if any tests fail.

  Usage Notes
  -----------
  - Pings each configured printer and records pass/fail status
  - Performs DNS lookup for failed printers as diagnostics
  - Optional email alerts via sendmail when failures occur
  - Ping count: 2 packets, timeout: 5 seconds
  - Email alerts disabled by default

  Requirements
  ------------
  - macOS or Linux
  - Network access to printer hosts
  - PRINTERS: Array of printer hostnames or IP addresses
  - SEND_EMAIL / MAIL_TO / MAIL_FROM: Email notification settings
  - (Optional) sendmail for email alerts
