name: print_queue_reset.ps1
description: Resets Windows print queue by clearing spooler directory
language: PowerShell
tags:
- Antivirus
- Services
- Windows
runAs: SYSTEM_USER
timeout: 15
readme: |
  Purpose
  -------
  Resets and clears the Windows print queue by stopping the Print Spooler service, removing all queued print jobs from the spooler directory, and restarting the service. Resolves common printing issues caused by stuck or corrupted print jobs that prevent new documents from printing.

  Usage Notes
  -----------
  - Stops the Print Spooler service if running and waits for handles to release
  - Attempts to remove print job files with retry logic (3 attempts per file)
  - Reports successfully removed and locked files separately
  - Locked files are removed when service restarts
  - Spooler directory: %SystemRoot%\System32\spool\PRINTERS
  - Service stop/start timeout: 30 seconds each

  Requirements
  ------------
  - Windows operating system
  - Administrator privileges
  - Print Spooler service must exist
  - $serviceName: Service name (default: "Spooler")
  - $stopTimeout / $startTimeout: Timeout in seconds (default: 30)
