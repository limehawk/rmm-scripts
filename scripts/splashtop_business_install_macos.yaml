name: splashtop_business_install_macos.sh
description: Downloads and installs Splashtop Business client on macOS
language: Bash
tags:
- Mac
- Software
runAs: SYSTEM_USER
timeout: 15
readme: |
  Purpose
  -------
  Downloads and installs the Splashtop Business client application on macOS. The Business client allows users to connect to remote computers with Splashtop Streamer installed.

  Usage Notes
  -----------
  - Downloads installer DMG from official Splashtop servers (v3.7.2.0)
  - Mounts the DMG, installs the package, then unmounts
  - Installer DMG is removed after installation
  - Mount directory: /Volumes/Splashtop Business

  Requirements
  ------------
  - macOS
  - Root/sudo privileges
  - Internet connectivity
