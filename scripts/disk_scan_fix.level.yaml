name: disk_scan_fix.sh
description: Comprehensive disk and volume health check for macOS
shell: BASH
runAs: SYSTEM
timeout: 15
readme: |
  Purpose
  -------
  Performs a comprehensive health check on all mounted disks and volumes on macOS. Verifies partition maps, file systems, and SMART status where supported.

  Usage Notes
  -----------
  - Auto-detects all mounted disks
  - Verifies partition map for each disk
  - Checks file system health for HFS and APFS volumes
  - Reports SMART status when available
  - Read-only operations (verification only, no modifications)

  Requirements
  ------------
  - macOS operating system
  - Root/sudo privileges
