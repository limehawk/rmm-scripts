name: splashtop_business_install.ps1
description: Installs Splashtop Business client via winget
shell: POWERSHELL
runAs: SYSTEM
timeout: 15
readme: |
  Purpose
  -------
  Installs the Splashtop Business client application using winget (Windows Package Manager). This is the end-user remote access client, not the streamer agent.

  Usage Notes
  -----------
  - Uses winget to install Splashtop.SplashtopBusiness package
  - Detects SYSTEM vs user context for winget path resolution
  - Handles already-installed case gracefully
  - Silent installation with automatic agreement acceptance

  Requirements
  ------------
  - Windows OS
  - Administrator privileges
  - Winget installed (run winget_setup.ps1 if needed)
  - Internet connectivity
