name: delprof2_delete_old_profiles.ps1
description: Deletes Windows user profiles older than specified days
language: PowerShell
tags:
- Administration
- Cleanup
- Windows
runAs: SYSTEM_USER
timeout: 15
readme: |
  Purpose
  -------
  Deletes Windows user profiles older than a specified number of days. Uses DelProf2 utility downloaded directly from helgeklein.com.

  Usage Notes
  -----------
  - Downloads and extracts DelProf2 if not already cached
  - Executes delprof2.exe /u /d:X /ed:gaia /ed:administrator
  - Always protects gaia and administrator profiles
  - Cleans up cached files after execution
  - Set $days_old runtime variable to control threshold (default: 30 days)

  Requirements
  ------------
  - Windows 10/11
  - Administrator privileges
  - Internet access for DelProf2 download from helgeklein.com
  - Runtime variable: $days_old (number of days; default 30)

  Security
  --------
  - DESTRUCTIVE OPERATION - deleted profiles cannot be recovered
favourite: false
shared: false
runtimeVariables:
- name: days_old
scriptId: '259059068233703424'
