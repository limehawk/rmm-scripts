name: workstation_rename_manual_macos.sh
description: Renames macOS device with custom name via RMM variable
shell: BASH
runAs: SYSTEM
timeout: 15
readme: |
  Purpose
  -------
  Renames a macOS device using a custom client segment with standardized naming pattern: CLIENT-USER-UUID. Allows variable length client segment override. Sets HostName, ComputerName, and LocalHostName. Designed for RMM deployment with custom client naming.
  
  Usage Notes
  -----------
  - Custom client from $YourCustomClientHere (variable length, primary)
  - Fallback to $YourClientNameHere if custom not set
  - Username detected from current console user
  - UUID from hardware identifier
  - Final hostname is exactly 15 characters (NetBIOS compatible)
  - Flushes DNS cache after rename
  - Skips rename if hostname already matches
  
  Requirements
  ------------
  - macOS 10.14 or later
  - Root/sudo access
  - RMM variable $YourCustomClientHere or $YourClientNameHere must be set
