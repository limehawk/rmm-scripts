name: outlook_link_handling_fix.ps1
description: Configures Outlook to open hyperlinks in the default browser
shell: POWERSHELL
runAs: SYSTEM
timeout: 900
readme: |
  Purpose
  -------
  Fixes an issue where clicking shared file links (OneDrive, SharePoint) in Outlook incorrectly launches Outlook Classic instead of opening in the default web browser. Sets the documented Office link handling registry values to use the system default browser.
  
  Usage Notes
  -----------
  - Checks if the Office Links registry path exists and creates it if missing
  - Sets BrowserChoice to 1 (Default Browser)
  - Sets DecisionComplete to 1 (locks in the preference)
  - Restart Outlook after running for changes to take effect
  - $registryPath: HKCU:\Software\Microsoft\Office\16.0\Common\Links
  
  Requirements
  ------------
  - PowerShell 5.1 or later
  - No administrator privileges required (HKCU is user-writable)
  - Microsoft Office 2016 or later (Office 16.0)
