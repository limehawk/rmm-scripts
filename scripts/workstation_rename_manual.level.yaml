name: workstation_rename_manual.ps1
description: Renames Windows device with custom client segment override
shell: POWERSHELL
runAs: SYSTEM
timeout: 15
readme: |
  Purpose
  -------
  Renames a Windows device using the pattern CLIENT-USERUUID (max 15 chars) and syncs the same name to SuperOps. CLIENT is a custom override from $YourCustomClientHere (variable length, sanitized A-Z0-9), falling back to $YourClientNameHere. USER is the sanitized username (maximized, truncated if needed), and UUID is the SMBIOS UUID tail (at least 3 chars).

  Usage Notes
  -----------
  - Requires SuperOps runtime variables:
    - $YourApiKeyHere: SuperOps API key
    - $YourCustomClientHere: Custom client segment (overrides auto 3-char)
    - $YourAssetIdHere: Asset ID (placeholder)
    - $YourAssetNameHere: Current asset name (placeholder)
    - $YourClientNameHere: Client name fallback (placeholder)
  - Only A-Z, 0-9, and hyphen used in hostname
  - Always exactly 15 characters
  - SuperOps asset name updated via GraphQL API
  - Reboot required for hostname change to take effect

  Requirements
  ------------
  - Windows 10/11
  - Administrator privileges
  - SuperOps agent installed
  - Internet access for SuperOps API
variables:
- name: YourApiKeyHere
- name: YourCustomClientHere
