name: superops_agent_uninstall_linux.sh
description: Uninstalls SuperOps RMM agent from Linux using vendor script
language: Bash
tags:
- Cleanup
- Linux
- Software
runAs: SYSTEM_USER
timeout: 15
readme: |
  Purpose
  -------
  Uninstalls the SuperOps RMM agent from Linux by running the vendor uninstall.sh from every known SuperOps and Limehawk install path. Already-removed is success.

  Usage Notes
  -----------
  - Tries each path in order and runs the first uninstall.sh found
  - Sets executable permissions before running
  - Missing agent is exit 0
  - Looks under /opt/superopsrmm, SuperOpsRMM, limehawkrmm, limehawk, Limehawkrmmagent, and /usr/local/superops

  Requirements
  ------------
  - Bash shell
  - Linux operating system
  - Root/sudo privileges
  - UNINSTALL_PATHS: hardcoded list of vendor uninstall.sh locations

  Security
  --------
  - Executes only the vendor uninstall script
  - Requires root privileges to execute
