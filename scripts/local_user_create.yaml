name: local_user_create.ps1
description: Creates a new local user account with specified username and password
language: PowerShell
tags:
- Administration
- Windows
runAs: SYSTEM_USER
timeout: 15
readme: |
  Purpose
  -------
  Creates a new local user account with specified username and password. Optionally adds the user to the Administrators group.

  Usage Notes
  -----------
  - Validates inputs before creating the account
  - Creates a standard local user account
  - Optionally adds the user to the Administrators group
  - Reports final status with user details

  Requirements
  ------------
  - Windows 10/11
  - Admin privileges required
  - PowerShell 5.1+
  - Username provided via SuperOps $NewUsername variable
  - Password provided via SuperOps $NewPassword variable
  - AddToAdmin set to "Yes" or "No" (default: "No")

  Security
  --------
  - Password visible in script -- use RMM variables for production
favourite: false
shared: true
runtimeVariables:
- name: NewUsername
- name: NewPassword
scriptId: '1015906830558752768'
lastPushedChecksum: sha256:11eced3f499bf362
lastPushedMetaChecksum: sha256:ac5baf1c3ab43d24
