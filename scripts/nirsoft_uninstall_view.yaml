name: nirsoft_uninstall_view.ps1
description: Uses NirSoft UninstallView to uninstall software matching wildcard patterns
language: PowerShell
tags:
- Cleanup
- Windows
runAs: SYSTEM_USER
timeout: 15
readme: |
  Purpose
  -------
  Downloads NirSoft UninstallView utility and uses it to uninstall software matching a specified pattern using wildcard matching.

  Usage Notes
  -----------
  - Edit $appName variable with application name or pattern to uninstall
  - Supports wildcards (e.g., Adobe*, *Chrome*, etc.)
  - Determines system architecture and downloads appropriate 32/64-bit version
  - Extracts to limehawk\nirsoft directory
  - Runs uninstall command with wildcard matching
  - Cleans up downloaded zip file after extraction
  - Check manually after execution to confirm uninstallation

  Requirements
  ------------
  - Windows OS
  - Administrator privileges
  - Internet connectivity (downloads from official NirSoft website)
