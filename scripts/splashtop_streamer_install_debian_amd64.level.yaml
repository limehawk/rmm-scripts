name: splashtop_streamer_install_debian_amd64.sh
description: Installs Splashtop Streamer on Debian/Ubuntu AMD64 systems
shell: BASH
runAs: SYSTEM
timeout: 15
readme: |
  Purpose
  -------
  Downloads and installs the Splashtop Streamer agent on Debian/Ubuntu systems running AMD64 architecture.

  Usage Notes
  -----------
  - Updates package lists before installation
  - Downloads tarball from official Splashtop servers (v3.7.2.0)
  - Extracts to /opt/splashtop install directory
  - Installs deb package with automatic dependency resolution
  - Cleans up downloaded tarball after installation

  Requirements
  ------------
  - Debian/Ubuntu Linux (AMD64 architecture)
  - Root/sudo privileges
  - Internet connectivity
  - wget and tar packages
