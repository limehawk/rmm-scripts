name: dokploy_running_apps_deploy.sh
description: Redeploys all running Dokploy apps via local API
language: Bash
tags:
- Linux
- Maintenance
runAs: SYSTEM_USER
timeout: 15
readme: |
  Purpose
  -------
  Automates redeployment of all running Dokploy applications. Queries the Dokploy PostgreSQL database for application status, then triggers deployments in parallel via the local Dokploy API (localhost:3000). Idle applications are skipped.

  Usage Notes
  -----------
  - Queries app name, project, status, and applicationId from the Dokploy database
  - Skips applications with "idle" status; deploys all others in parallel
  - DOKPLOY_API_KEY: supply via environment variable, or set directly in the copy pasted into the Dokploy schedule (generate in Dokploy Settings > API/CLI)
  - Exits 1 if any deployment fails so the scheduler surfaces the failure

  Requirements
  ------------
  - Must run on the Dokploy host server (Dokploy schedule or cron)
  - Dokploy postgres container accessible via docker exec
  - curl installed

  Security
  --------
  - API key is never committed to version control; provide it at runtime
  - No secrets are written to logs
  - All API calls are localhost-only, no external network traffic
