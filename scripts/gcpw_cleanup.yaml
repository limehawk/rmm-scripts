name: gcpw_cleanup.ps1
description: Removes GCPW registry keys and folders for clean reinstallation
language: PowerShell
tags:
- Applications
- Cleanup
- Windows
runAs: SYSTEM_USER
timeout: 15
readme: |
  Purpose
  -------
  Removes Google Credential Provider for Windows (GCPW) registry keys and folders to allow for a clean reinstallation or complete removal.

  Usage Notes
  -----------
  - Deletes GCPW-related registry keys
  - Deletes Chrome enrollment registry keys
  - Removes GCPW policy and credential folders
  - Reports results for each operation
  - No inputs required
  - Does NOT uninstall GCPW itself (use Programs and Features for that)

  Requirements
  ------------
  - Windows 10/11 or Windows Server
  - Administrator privileges
