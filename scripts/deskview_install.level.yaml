name: deskview_install.ps1
description: Installs DeskView utility to startup folder for desktop icons
shell: POWERSHELL
runAs: SYSTEM
timeout: 900
readme: |
  Purpose
  -------
  Downloads deskview.exe utility to the Windows Startup folder so it runs automatically at user login. DeskView displays desktop icons in a compact window.
  
  Usage Notes
  -----------
  - Validates input parameters before proceeding
  - Downloads deskview.exe to the common Startup folder for all users
  - Runs automatically at user login after installation
  - Configurable variable: $downloadUrl
  
  Requirements
  ------------
  - Windows OS
  - Administrator privileges
  - Internet connectivity
