name: delprof2_profiles_delete_all.ps1
description: Deletes ALL Windows user profiles except protected ones
shell: POWERSHELL
runAs: SYSTEM
timeout: 900
readme: |
  Purpose
  -------
  Deletes ALL Windows user profiles except protected ones (gaia, administrator). Uses DelProf2 utility downloaded directly from helgeklein.com.
  
  Usage Notes
  -----------
  - Downloads and extracts DelProf2 if not already cached
  - Executes delprof2.exe /u /ed:gaia /ed:administrator
  - Always protects gaia and administrator profiles
  - Cleans up cached files after execution
  
  Requirements
  ------------
  - Windows 10/11
  - Administrator privileges
  - Internet access for DelProf2 download from helgeklein.com
  
  Security
  --------
  - DESTRUCTIVE OPERATION - deleted profiles cannot be recovered
