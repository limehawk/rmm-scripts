name: sentinelone_uninstall_linux.sh
description: Uninstalls SentinelOne agent from Linux using passphrase
shell: BASH
runAs: SYSTEM
timeout: 15
readme: |
  Purpose
  -------
  Uninstalls the SentinelOne agent from Linux systems using the sentinelctl command. Verifies the agent is installed and sentinelctl is available before attempting removal.

  Usage Notes
  -----------
  - No hardcoded inputs required
  - Verifies root privileges before proceeding
  - Checks if sentinelctl command is available in PATH
  - Runs sentinelctl uninstall to remove the agent
  - Agent may have tamper protection enabled which could block removal

  Requirements
  ------------
  - Linux system with SentinelOne agent installed
  - Root/sudo privileges
  - sentinelctl must be in PATH (/usr/local/bin or /opt/sentinelone/bin)
