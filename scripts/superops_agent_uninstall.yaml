name: superops_agent_uninstall.ps1
description: Uninstalls SuperOps/Limehawk RMM agent and leftover remnants
language: PowerShell
tags:
- Cleanup
- Software
- Windows
runAs: SYSTEM_USER
timeout: 20
readme: |
  Purpose
  -------
  Removes the SuperOps RMM agent (including Limehawk-branded installs) from Windows. Tamper protection can leave the service and files after MSI reports success, so the service is deleted first, msiexec is watched for hangs, and leftovers are verified before exit. Missing product is success so the script is safe to re-run.

  Usage Notes
  -----------
  - Silent MSI args: /qn /norestart
  - msiexec hang timeout: 90 seconds (near-zero CPU = hung, then taskkill)
  - msiexec exit 0 is not proof the agent is gone
  - Service match is name/display limehawk* / superops*, or ImagePath
  - Already-removed agent is exit 0
  - sc stop + sc delete FIRST (works with tamper on)
  - Then msiexec /x for each product code; leftover dirs and registry cleaned
  - Verifies service 1060, no limehawkrmm processes, dirs gone

  Requirements
  ------------
  - PowerShell 5.1 or later
  - Administrator privileges
  - Windows
  - $ProductGuid: SuperOps agent MSI IdentifyingNumber (hardcoded)

  Security
  --------
  - No network calls
  - Does not touch Limehawk user profiles or branding pictures
