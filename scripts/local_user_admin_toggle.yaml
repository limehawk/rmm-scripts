name: local_user_admin_toggle.ps1
description: Adds or removes a local user from the Administrators group
language: PowerShell
tags:
- Administration
- Windows
runAs: SYSTEM_USER
timeout: 15
readme: |
  ## Purpose
  Adds or removes a local user from the Administrators group. Idempotent operation that ensures the user's group membership aligns with the requested action.

  ## Usage
  Provide the following SuperOps runtime variable:
  - `TargetUsername` - The local user account to manage

  Configure the action via hardcoded setting:
  - `Action` - "add" or "remove"

  ## Requirements
  - Windows 10/11
  - Admin privileges required
  - Target user must exist locally
favourite: false
shared: true
runtimeVariables:
- name: TargetUsername
scriptId: '1015917390952198144'
