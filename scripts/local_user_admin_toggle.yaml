name: local_user_admin_toggle.ps1
description: Adds or removes a local user from the Administrators group
language: PowerShell
tags:
- Administration
- Windows
runAs: SYSTEM_USER
timeout: 15
readme: |
  Purpose
  -------
  Adds or removes a local user from the Administrators group. Idempotent operation that ensures the user's group membership aligns with the requested action.

  Usage Notes
  -----------
  - Validates user exists before operation
  - Checks current membership status
  - Adds or removes from Administrators group
  - Reports final status
  - Operates on the built-in Administrators group
  - $TargetUsername: the local user account to manage (SuperOps runtime variable)
  - $Action: set to "add" or "remove" (hardcoded setting)

  Requirements
  ------------
  - Windows 10/11
  - Admin privileges required
  - Target user must exist locally
favourite: false
shared: true
runtimeVariables:
- name: TargetUsername
scriptId: '1015917390952198144'
lastPushedChecksum: sha256:3abff5341592a6ce
lastPushedMetaChecksum: sha256:2382ffa16f151965
