name: google_update_trigger.ps1
description: Triggers Google Update scheduled task to check for Chrome updates
shell: POWERSHELL
runAs: SYSTEM
timeout: 900
readme: |
  Purpose
  -------
  Triggers the Google Update scheduled task to force an immediate check for Chrome and other Google product updates.
  
  Usage Notes
  -----------
  - Searches for scheduled tasks matching "GoogleUpdateTaskMachineUA"
  - Starts matching tasks and reports status
  - No inputs required; task name pattern is hardcoded
  
  Requirements
  ------------
  - Windows 10/11
  - Google Chrome or other Google products installed
  - Administrator privileges
