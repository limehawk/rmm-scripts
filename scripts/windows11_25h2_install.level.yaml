name: windows11_25h2_install.ps1
description: Path-aware silent upgrade to Windows 11 25H2 for Level RMM
shell: POWERSHELL
runAs: SYSTEM
timeout: 14400
readme: |
  Purpose
  -------
  Detects the current Windows version and chooses a clean upgrade path to Windows 11 version 25H2 for Level RMM (run as System).
  
  Paths
  -----
  - Already 25H2: no-op success
  - Windows 11 24H2 (build 26100) with UBR 5074+: enablement package KB5054156 (wusa silent)
  - Windows 11 24H2 with low UBR: fail and require KB5064081+ cumulative update first
  - Windows 10 or Windows 11 older than 24H2: full feature upgrade via Windows Update (if offered), else Windows 11 Installation Assistant
  
  Usage Notes
  -----------
  - Level: run as System; timeout 14400 seconds (4 hours)
  - DISM health preflight before upgrade (ScanHealth; RestoreHealth if repairable)
  - Corruption found and fixed: 5-min user warning reboot, then auto-resume upgrade via SYSTEM startup task
  - Corruption found but not fixed (or ScanHealth fails): abort upgrade
  - Reboot After Install defaults to true (60s scheduled reboot after eKB success)
  - Full upgrade via WU/IA may reboot on its own even when the flag is false
  - Prefer Windows Update is true by default; falls back to Installation Assistant
  - Installation Assistant: https://go.microsoft.com/fwlink/?linkid=2171764
  - eKB MSU URLs: Microsoft catalog KB5054156 x64 and ARM64
  
  Requirements
  ------------
  - Level agent online; script executed as System
  - Internet connectivity
  - eKB path: Windows 11 24H2 build 26100 UBR 5074+
  - Full upgrade path: Windows 11 hardware requirements must be met
  
  Security
  --------
  - No secrets in logs
  - Downloads only from Microsoft endpoints
  - Resume artifacts under ProgramData\Limehawk\windows11_25h2_install cleaned after success
