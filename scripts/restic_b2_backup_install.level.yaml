name: restic_b2_backup_install.ps1
description: Installs Restic, configures B2 repository, schedules daily backups
shell: POWERSHELL
runAs: SYSTEM
timeout: 30
readme: |
  Purpose
  -------
  All-in-one installer for Restic backup to Backblaze B2 with immutable storage. Downloads Restic via winget, initializes an encrypted B2 repository scoped to the machine hostname, generates a daily backup script with embedded credentials, and creates a Windows Scheduled Task. Designed for deployment via SuperOps RMM to client workstations and servers.
  
  Usage Notes
  -----------
  - Validates all hardcoded inputs are non-empty before proceeding
  - Installs Restic via winget, copies binary to managed install directory
  - ACL-locks install directory to SYSTEM + Administrators only
  - Initializes B2 repository (skips if already exists)
  - Generates daily backup script with embedded credentials and retention policy
  - Creates Windows Scheduled Task for daily execution at 02:00 as SYSTEM
  - Runs dry-run backup to verify B2 connectivity and path access
  - Default backup paths: Documents, Desktop, Downloads, Pictures, Videos
  - Default excludes: temp files, cache directories, OneDrive, Recycle Bin
  - Retention policy: 7 daily, 4 weekly, 6 monthly snapshots
  
  Requirements
  ------------
  - Windows 10/11 or Windows Server 2016+
  - Administrator privileges (runs as SYSTEM via RMM)
  - winget (App Installer) available on the system
  - Network access to Backblaze B2
  - SuperOps runtime variables: B2KeyId, B2AppKey, B2BucketName, RepoPassword, ClientName
  
  Security
  --------
  - B2 credentials are embedded in the generated backup script
  - Install directory is ACL-locked to SYSTEM + Administrators
  - Repo password encrypts all backup data at rest
