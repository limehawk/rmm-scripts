name: rustic_backup.ps1
description: Runs rustic backup, prune, and integrity check using existing profile
language: PowerShell
tags:
- Backup
- Windows
runAs: SYSTEM_USER
timeout: 120
readme: |
  Purpose
  -------
  Scheduled backup runner for Rustic. Reads configuration from the TOML profile written by rustic_install.ps1 and executes a full backup cycle: backup snapshot, retention prune, and a lightweight integrity check on a random 1% data subset. Designed to be invoked by the Windows Scheduled Task created during installation, or manually via SuperOps RMM.

  Usage Notes
  -----------
  - No runtime variables required — all configuration is read from the TOML profile
  - Run rustic_install.ps1 first to deploy the binary, TOML config, and Scheduled Task
  - Verifies rustic.exe and rustic.toml exist before proceeding (exits 1 if missing)
  - Sets RUSTIC_CONFIG_FILE environment variable, clears it in a finally block
  - Backup step is fatal: exits 1 if rustic backup fails (no snapshot was created)
  - Prune step is non-fatal: warns and continues if rustic forget --prune fails
  - Integrity check is non-fatal: warns and continues if rustic check fails
  - All rustic output is piped to console with two-space indent for clean RMM logs
  - Reports duration and per-step status in the final summary

  Requirements
  ------------
  - rustic_install.ps1 must have been run successfully on this machine
  - rustic.exe at C:\ProgramData\Limehawk\Rustic\bin\rustic.exe
  - rustic.toml at C:\ProgramData\Limehawk\Rustic\rustic.toml
  - Windows 10/11 or Windows Server 2016+
  - Administrator privileges (runs as SYSTEM via RMM or Scheduled Task)
favourite: false
shared: false
