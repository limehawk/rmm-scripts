name: rename_to_snake_case.ps1
description: Recursively renames files and folders to snake_case format
language: PowerShell
tags:
- Maintenance
- Windows
runAs: SYSTEM_USER
timeout: 15
readme: |
  Purpose
  -------
  Recursively renames all files and folders in a directory to snake_case format. Converts spaces, hyphens, and other non-alphanumeric characters to underscores and lowercases all characters.

  Usage Notes
  -----------
  - Set target directory via SuperOps runtime variable $YourTargetPathHere
  - Converts to lowercase, replaces non-alphanumeric characters with underscores
  - Trims leading/trailing underscores from names
  - Processes child items first (bottom-up) to avoid path issues
  - Skips items already in snake_case format
  - Reports each rename operation and final counts
  - WARNING: Cannot be undone -- backup important directories first

  Requirements
  ------------
  - Windows 10/11
  - Write permissions to target directory
  - PowerShell 5.1+
favourite: false
shared: true
runtimeVariables:
- name: YourTargetPathHere
scriptId: '1154509803255455744'
lastPushedChecksum: sha256:80c611c6757117e5
