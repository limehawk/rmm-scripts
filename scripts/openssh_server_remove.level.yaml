name: openssh_server_remove.ps1
description: Removes OpenSSH Server, firewall rule, and cleans up config
shell: POWERSHELL
runAs: SYSTEM
timeout: 300
readme: |
  Purpose
  -------
  Stops and removes the OpenSSH Server from Windows. Removes the firewall rule, uninstalls the Windows capability, and optionally cleans up the sshd configuration directory.
  
  Usage Notes
  -----------
  - Stops the sshd and ssh-agent services
  - Removes the Windows Firewall rule OpenSSH-Server-In-TCP
  - Removes the default shell registry key
  - Uninstalls the OpenSSH.Server Windows capability
  - Removes sshd config directory if configured (default: true)
  - $RemoveConfig controls whether to delete C:\ProgramData\ssh (default: true)
  - $RemoveHostKeys controls whether to delete host keys with config (default: true)
  
  Requirements
  ------------
  - Windows Server 2019+ or Windows 10 1809+
  - Administrator privileges
  
  Security
  --------
  - Host keys are deleted by default to prevent reuse
  - Config removal ensures no stale authorized_keys remain
