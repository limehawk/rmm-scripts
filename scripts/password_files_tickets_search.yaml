name: password_files_tickets_search.ps1
description: Searches for password files and creates SuperOps tickets
language: PowerShell
tags:
- Security
- Windows
runAs: SYSTEM_USER
timeout: 15
readme: |
  Purpose
  -------
  Scans all user profiles on a Windows machine for files that may contain passwords or credentials. Creates a SuperOps ticket assigned to the requester associated with the asset when findings are detected.

  Usage Notes
  -----------
  - Enumerates all user profiles in C:\Users (excludes Public, Default)
  - Searches Desktop, Documents, Downloads, Pictures, and cloud folders
  - Patterns include: *password*, *credential*, *creds*, *logins*, etc.
  - Separates critical findings from regular findings
  - Critical findings trigger HIGH priority tickets; regular findings get Medium priority
  - Looks up asset in SuperOps by hostname and assigns ticket to asset's requester
  - Optional Google Chat webhook alert in addition to ticket creation
  - Read-only file operation -- does not modify or delete files
  - File contents are NOT read, only metadata reported

  Requirements
  ------------
  - PowerShell 5.1 or later
  - Administrator privileges (to access other user profiles)
  - SuperOps API key with ticket creation permissions ($SuperOpsApiKey runtime variable)
  - Optional: GoogleChatWebhook runtime variable for webhook alerts

  Security
  --------
  - API key should be stored securely in SuperOps variables
favourite: false
shared: false
runtimeVariables:
- name: SuperOpsApiKey
- name: GoogleChatWebhook
