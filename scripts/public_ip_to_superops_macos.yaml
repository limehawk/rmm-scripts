name: public_ip_to_superops_macos.sh
description: Fetches public IP info from wtfismyip.com and outputs formatted results
language: Bash
runAs: ROOT
timeout: 15
tags:
  - Linux
  - Network
  - macOS
shared: true
favourite: false
readme: >
  Purpose

  -------

  Queries wtfismyip.com/json to retrieve public IP address, ISP, geolocation,
  and hostname information. Formats the results into readable stdout output.
  Note: macOS/Linux SuperOps agents do not support Send-CustomField, so results
  are output only.


  Usage Notes

  -----------

  - Queries wtfismyip.com/json for public IP details

  - Formats IP, Location, Hostname, ISP, Country, and Tor Exit status

  - Outputs to stdout (no custom field sync on macOS/Linux)

  - Uses curl and python3 (both pre-installed on macOS)


  Requirements

  ------------

  - curl and python3 installed

  - Internet connectivity to reach wtfismyip.com
