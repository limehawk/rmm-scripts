name: splashtop_service_restart.ps1
description: Restarts Splashtop Remote Service to resolve connectivity issues
shell: POWERSHELL
runAs: SYSTEM
timeout: 900
readme: |
  Purpose
  -------
  Restarts the Splashtop Remote Service to resolve connectivity or performance issues with Splashtop remote access.
  
  Usage Notes
  -----------
  - Validates service name input and checks service exists
  - Default service: SplashtopRemoteService
  - Restarts the service and waits 3 seconds
  - Reports final service status (Running or warning)
  
  Requirements
  ------------
  - Windows OS
  - Administrator privileges
  - Splashtop Streamer installed
  - $serviceName: name of the Splashtop service to restart
