name: google_update_trigger.ps1
description: Triggers Google Update scheduled task to force an immediate check for Chrome updates
language: PowerShell
tags:
- Applications
- Windows
runAs: SYSTEM_USER
timeout: 15
readme: |
  ## Purpose
  Triggers the Google Update scheduled task to force an immediate check for Chrome and other Google product updates.

  ## Usage
  No inputs required. The script automatically finds and triggers GoogleUpdateTaskMachineUA scheduled tasks.

  ## Requirements
  - Windows 10/11
  - Google Chrome or other Google products installed
  - Administrator privileges
