name: prinstall_setup.ps1
description: Installs or uninstalls prinstall from GitHub releases
language: PowerShell
tags:
- Software
- Windows
runAs: SYSTEM_USER
timeout: 10
readme: |
  Purpose
  -------
  Installs or uninstalls prinstall. Install mode downloads the latest release from GitHub and extracts the binary to C:\ProgramData\prinstall\. Uninstall mode removes the binary and install directory. Prinstall is a CLI/TUI tool for discovering network printers, matching drivers, and installing them on Windows.

  Usage Notes
  -----------
  - Set InstallOrUninstall to 'install' or 'uninstall'
  - Install: queries GitHub Releases API for latest version, downloads and extracts
  - Uninstall: removes install directory and all contents
  - Verifies binary by running prinstall --version after install

  Requirements
  ------------
  - Windows OS
  - Administrator privileges
  - Internet connectivity to github.com (install only)
favourite: false
shared: false
runtimeVariables:
- name: InstallOrUninstall
