name: prinstall_driver_remove.ps1
description: Removes a driver from the Windows driver store using prinstall 0.4.13+
shell: POWERSHELL
runAs: SYSTEM
timeout: 600
readme: |
  Purpose
  -------
  Removes a print driver from the Windows driver store using prinstall 0.4.13+. Target is either an exact driver name or a fuzzy/model string that resolves to one staged driver. If the driver is in use by any printer queue, refuses unless $force = $true (cascade — removes dependent queues first).
  
  Usage Notes
  -----------
  - Set $YourDriverTargetHere to the driver name from `prinstall driver list` or a fuzzy string
  - Leave $force $false by default — only set to $true when you explicitly want to destroy dependent queues
  - Windows system drivers (Microsoft IPP Class Driver, etc.) cannot be removed
  - Requires prinstall.exe 0.4.13+ installed (run prinstall_setup.ps1 first)
  
  Requirements
  ------------
  - Windows OS
  - Administrator privileges
  - prinstall.exe 0.4.13 or newer installed
  - $YourDriverTargetHere: Exact driver name OR fuzzy/model string
