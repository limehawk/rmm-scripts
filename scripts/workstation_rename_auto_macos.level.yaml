name: workstation_rename_auto_macos.sh
description: Auto-renames macOS device using CLIENT-USER-UUID pattern
shell: BASH
runAs: SYSTEM
timeout: 900
readme: |
  Purpose
  -------
  Automatically renames a macOS device using a standardized naming pattern: CLIENT3-USER-UUID. Sets HostName, ComputerName, and LocalHostName. Designed for RMM deployment with automatic client/user detection.
  
  Usage Notes
  -----------
  - Client name from RMM placeholder $YourClientNameHere (3-char abbreviation used)
  - Username detected from current console user
  - UUID from hardware identifier
  - Final hostname is exactly 15 characters (NetBIOS compatible)
  - Flushes DNS cache after rename
  - Skips rename if hostname already matches
  
  Requirements
  ------------
  - macOS 10.14 or later
  - Root/sudo access
  - RMM variable $YourClientNameHere must be set
