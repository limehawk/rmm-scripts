name: sentinelone_install.ps1
description: Silently installs the SentinelOne agent from a Level-staged, signature-verified installer with a site token
language: PowerShell
tags:
  - Antivirus
  - Software
  - Windows
runAs: SYSTEM_USER
timeout: 15
readme: |
  Purpose
  -------
  Installs the SentinelOne endpoint agent silently using a site token from a Level custom field. The installer is staged on the device ahead of time by a Level automation step; this script never downloads anything. Before running the installer it checks the Authenticode signature is valid and was issued to SentinelOne, so a swapped or tampered file is never run. Skips if the agent is already installed. The installed version will auto-update based on your S1 console Auto-Upgrade Policy settings, so the initial installer version does not matter.

  Usage Notes
  -----------
  - Validates the site token is present and was substituted by Level
  - Exits 0 without changes if the SentinelAgent service already exists
  - Uses C:\Windows\Temp\SentinelAgent.msi (x64), or SentinelAgent.exe (ARM64) if no MSI; fails if neither exists
  - Verifies the Authenticode signature: Status must be Valid and the signer certificate Subject O= must be "SentinelOne Inc." (current installers) or "Sentinelone, Inc." (older), case-insensitive
  - Runs the installer silently with the site token (msiexec /qn or EXE -q)
  - Verifies the SentinelAgent service appears, with retries
  - Removes the staged installer whether the install succeeded or not

  Requirements
  ------------
  - Windows 10/11 or Windows Server
  - Administrator privileges (Level runs as SYSTEM)
  - PowerShell 5.1 or later
  - Installer already staged at C:\Windows\Temp\SentinelAgent.msi or .exe
  - $SiteToken: SentinelOne site token for agent registration, injected at runtime from the Level custom field cf_s1_site_token ({{cf_s1_site_token}} placeholder). Get the token from S1 Console > Sentinels > Site Info

  Security
  --------
  - No third-party downloads: only the Level-staged file is ever run
  - Installer must carry a valid Authenticode signature from SentinelOne
  - Site token is never printed in full (first 10 characters + ***)
favourite: false
shared: false
runtimeVariables:
  - name: SiteToken
